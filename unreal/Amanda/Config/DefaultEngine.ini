; What MetaHuman needs of the renderer, and it is not optional: the editor
; raises a "Missing Project Settings" dialog about SKM_Face without these.
;
; The skin cache is the one that matters most. Hair grooms are simulated and
; rendered off the cached skinned positions, so with it off there is nowhere for
; strands to attach -- and the face deforms on a path MetaHuman was not authored
; against. The bone-index and influence settings are what a MetaHuman face rig
; needs to skin correctly at all.
; The editor throttles its tick rate when it is not the foreground window, and
; drops it further when nothing is being interacted with. For a game that is
; sensible. For an avatar being watched -- and measured -- it is not: the face
; animates in slow motion until you wiggle the mouse over the viewport, and any
; measurement that counts frames and assumes 60 of them a second is wrong by
; whatever the throttle chose. That is how a blink rate of 7 a minute got
; reported as 21.
[/Script/UnrealEd.EditorPerformanceSettings]
bThrottleCPUWhenNotForeground=False
bMonitorEditorPerformance=False

