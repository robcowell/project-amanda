; MetaHuman's speech solver runs on the CPU. On Windows it defaults to DirectML
; on the GPU, where it shares the card with the render: measured 2026-09-11 at
; ~11 solves a second against 50 audio frames captured, and the audio source
; drops the backlog, so her face updated at 11 fps -- the "slow motion" Rob saw.
; On the CPU it keeps pace, 45-50 in speech. Read when the Live Link subject
; starts, so it has to be set here rather than from a console later.
[SystemSettings]
mh.RealtimeAudio.Backend=NNERuntimeORTCpu
