; Per-user game settings, and the defaults a fresh clone starts from. Once the
; editor has run, Saved/Config/WindowsEditor/GameUserSettings.ini holds the live
; values and overrides this file -- so a change here reaches an existing machine
; only after the saved line is edited or deleted too.

[/Script/Engine.GameUserSettings]
; Cap the frame rate at 60. Unthrottled, the editor rendered at ~87 fps even in
; the background, and with the speech solver now loading the CPU at the same
; time the PC shut down under the combined draw on 2026-09-11 -- the 2080 Ti is
; known for transient spikes. Her face updates at 50 fps, so frames beyond 60
; bought nothing visible.
;
; It has to be this setting, not t.MaxFPS in DefaultEngine.ini: game settings
; apply FrameRateLimit after the ini, through UEngine::SetMaxFPS, which keeps
; the variable's existing priority -- so a limit of 0 here silently undid a cap
; of 60 there. The log showed "Set CVar [[t.MaxFPS:60]]"; the running editor
; read 0.
FrameRateLimit=60.000000
