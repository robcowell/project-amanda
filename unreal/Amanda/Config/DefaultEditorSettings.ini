; Editor preferences for this project. UEditorPerformanceSettings is declared
; config=EditorSettings, so it is read from this file -- not DefaultEngine.ini,
; where it sat for a day doing nothing while the editor kept throttling.

[/Script/UnrealEd.EditorPerformanceSettings]
; Keep ticking at full rate when the editor is not the foreground window. With
; the default, Rob watched her face in slow motion until he moved the mouse
; over the viewport -- and every frame-counted measurement was made at whatever
; rate the throttle had picked.
bThrottleCPUWhenNotForeground=False
bMonitorEditorPerformance=False
