# Project Amanda -- orchestrator configuration.
# Secrets do not belong here; they come from the environment (build plan 25).

bridge:
  host: 127.0.0.1        # loopback only -- do not expose the avatar bridge
  port: 8765
  protocol_version: 1
  reconnect_backoff_ms: [250, 500, 1000, 2000, 5000]

# Keys map directly onto amanda.claude.client.ClaudeSettings.
claude:
  # Chosen for latency: measured at ~670ms to first token against ~2200ms for
  # claude-opus-5 on the same prompt, and time to first token is the one stage
  # nothing downstream can hide. See the README's latency table.
  model: claude-sonnet-5   # held in config, never hard-coded (build plan 4)

  # A spoken turn is short. A reply long enough to hit this cap has already
  # stopped being conversation.
  max_tokens: 1024

  # The latency lever. Opus 5 thinks by default and effort governs how much;
  # "low" suits chat. Explicitly disabling thinking on this model is a
  # documented footgun -- raise or lower effort instead, and watch T3.
  effort: low

  # Server-side refusal fallbacks: on a policy decline the API re-runs the same
  # request on a fallback model within the same call, routed by category.
  fallbacks: true

  # Research preview: the same model at up to 2.5x output tokens per second, at
  # premium pricing. A real lever on T6 - T0, and a spending decision.
  fast: false

  # Below the model's minimum cacheable prefix this silently does nothing,
  # which is the case for a short system prompt. Harmless, and correct once the
  # prompt grows.
  cache_system: true

# The word that starts a conversation.
#
# Without one, every utterance in earshot becomes a turn: the telly, someone on
# the phone next door, a conversation the avatar was not part of. That is a
# cost, a privacy and a false-trigger problem at once.
wake:
  # openwakeword needs no account and ships its models; porcupine needs a free
  # Picovoice key and can generate a keyword for any phrase. "none" listens to
  # everything, which is right for a headset and wrong for a shared room.
  backend: openwakeword

  # A placeholder. openWakeWord's vocabulary is fixed -- alexa, hey_jarvis,
  # hey_marvin, hey_mycroft -- and none of them is the character's name. For a
  # real "Amanda": generate a .ppn in the Picovoice console, set backend to
  # porcupine, and put the path here.
  keyword: hey_marvin

  # Measured against synthesised speech: the wake phrase scored 0.854 and an
  # ordinary sentence 0.000. Lower it if it misses you, raise it if the room
  # sets it off.
  threshold: 0.5

  # One spoken wake word scores above threshold on several consecutive chunks.
  cooldown_ms: 1500

  # How long the conversation stays open after the last thing anybody said.
  # Long enough not to need the wake word between turns.
  awake_seconds: 45

# Speech recognition. Sits between T0 and T1 and is pure added latency --
# nothing downstream can start until it finishes, and unlike Claude's first
# token there is no streaming to hide behind.
stt:
  # auto picks a real model if one is installed and falls back to canned text,
  # so a machine without the weights still runs the pipeline.
  engine: auto

  # Measured on this laptop for a 2s utterance: tiny.en ~590ms but mishears
  # proper nouns, base.en ~880ms and correct, small.en ~2370ms for no gain.
  model: base.en
  compute_type: int8
  language: en

  # Greedy. Beam search buys accuracy this workload does not need and costs
  # latency it cannot afford.
  beam_size: 1

performance:
  # A second, deliberately cheap call classifies the performance so it never
  # contaminates the spoken text (build plan 6, option A).
  classifier_model: claude-haiku-4-5
  classifier_max_tokens: 128

  # Phase 4 starts with a subset of the preset vocabulary.
  enabled_presets:
    - neutral_attentive
    - warm
    - considering
    - mildly_amused
    - concerned
    - uncertain
    - surprised

  # Ceilings, not targets. Start every coefficient lower than feels necessary
  # (build plan 18); the failure mode of AI avatars is exaggerated activity.
  max_intensity: 0.45
  default_transition_ms: 450

  smoothing:
    decay_per_second: 0.35   # emotional inertia
    hysteresis: 0.12         # resist preset flapping between utterances
    min_hold_ms: 900         # never change preset faster than this

gaze:
  # Fractions of time spent looking at the user, per conversation state.
  eye_contact:
    listening: 0.80
    thinking: 0.25
    speaking: 0.60
    idle: 0.15
  shift_interval_ms: [1200, 4500]   # stochastic within bounds
  transition_ms: 220

idle:
  blink_interval_ms: [2400, 6800]   # independent of speech boundaries
  breathing_period_ms: 4200
  head_drift_amplitude: 0.04
  posture_shift_interval_ms: [18000, 45000]

speech:
  # Phrase segmentation before TTS (build plan 12).
  min_phrase_chars: 40
  flush_timeout_ms: 600
  cancel_fade_ms: 80

# One JSON object per turn, appended (build plan 24). Turns "it feels sluggish"
# into something diagnosable: one slow reply says nothing, thirty say which
# stage moved. `tail -f turns.jsonl` while you talk to it.
telemetry:
  enabled: true

  # Relative paths resolve against the orchestrator directory. Gitignored --
  # it is a record of conversations, even without the transcripts.
  path: turns.jsonl

privacy:
  # Honoured by construction: nothing here writes captured audio anywhere.
  # Setting it true does not switch a feature on, and is warned about.
  retain_microphone_audio: false

  # Whether the turn log includes what was actually said. Off by default
  # (build plan 25); the timings are useful without the words.
  log_transcripts: false
