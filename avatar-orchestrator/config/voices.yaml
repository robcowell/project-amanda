# Voice identities and delivery.
#
# The provider is deliberately indirect: TTS provider lock-in is a named risk in
# the build plan whose consequence is an expensive redesign, so the engine is
# named here and nothing outside amanda.audio knows which one is speaking.

default: amanda

# Where the avatar's voice goes. On the Windows box this is the virtual audio
# cable Unreal reads as a microphone -- a name fragment is enough, so "cable
# input" matches "CABLE Input (VB-Audio Virtual Cable)". Null means the system
# default output, which is what you want while developing without Unreal.
output_device: null

# Fade applied when speech is cancelled. Short, because barge-in should feel
# like being interrupted rather than like a media player fading out. Perceived
# cut-off is this plus the sink's buffer.
cancel_fade_ms: 80

voices:
  amanda:
    # tone   -- the built-in stand-in: audible, correctly timed, not speech.
    # piper  -- local neural voices, loaded in-process.
    # command -- any CLI engine; set argv below.
    # Leave unset to use whichever engine is installed, best first.
    provider: null

    # Which voice model, by name fragment. Measured against the alternatives,
    # cori-medium has the fewest word-sized gaps of the fast voices -- the
    # gappier ones read as staccato. cori-high is smoother still at five times
    # the CPU, which is not worth it.
    #
    # Download with:
    #   python -m piper.download_voices --download-dir voices en_GB-cori-medium
    model: cori-medium

    voice_id: null
    # Left unset: a Piper model declares its own rate, and overriding it is how
    # you get a chipmunk.
    sample_rate: null
    format: pcm_s16le

    # Used when provider is "command". One entry per argument, no shell.
    #   espeak-ng: ["espeak-ng", "--stdout", "-s", "{rate}", "{text}"]
    #   piper:     ["piper", "--model", "{voice}", "--output-raw", "--", "{text}"]
    argv: null
    expects_wav: true

    # Base delivery speed, above 1.0 being faster. Chosen by ear against 1.00,
    # 1.35 and 1.75. Note that Piper's length_scale is markedly non-linear: 1.1
    # shortens a phrase by under 3%, and it takes roughly 1.4 before the change
    # is clearly audible, so the useful range sits higher than it looks.
    pace: 1.55

    # Multipliers applied on top of the base, once the performance director
    # exists. Staying near 1.0 is the norm -- a voice that audibly changes speed
    # between sentences draws attention to itself.
    pace_by_preset:
      neutral_attentive: 1.00
      listening: 1.00
      considering: 0.94
      warm: 0.97
      mildly_amused: 0.99
      concerned: 0.95
      uncertain: 0.96
      confused: 0.96
      surprised: 1.04
      explaining: 1.02
      enthusiastic: 1.06
      serious: 0.95
